[project]
name = "recursive-judge-study"
version = "0.1.0"
description = "Exact evidence audits for recursive generative rewards in GRPO"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "reportlab>=4", "matplotlib>=3.9", "python-dotenv>=1", "pytest>=8", "pypdf>=5"]

[project.optional-dependencies]
gpu = ["torch==2.15.0", "transformers==5.24.1", "peft==0.22.0", "bitsandbytes==0.50.2", "trl==1.19.0", "accelerate>=1.12", "datasets>=4.7", "safetensors>=0.5"]

[project.scripts]
study = "study.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
